<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>
      GP Mercatus – Global Digital Marketing Agency | Performance, SEO & Social
      Media
    </title>

    <meta
      name="description"
      content="GP Mercatus is a full-service global digital marketing agency helping brands grow through SEO, performance marketing, social media, and creative campaigns."
    />

    <meta
      name="keywords"
      content="digital marketing agency, SEO agency, performance marketing, social media marketing, Google Ads, Meta Ads"
    />

    <meta name="author" content="GP Mercatus" />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://www.gpmercatus.in/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#ffffff" />

    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="//www.googletagmanager.com" />
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Font Optimization -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Sitemap -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Preload Hero Image -->
    <link rel="preload" as="image" href="/hero.webp" fetchpriority="high" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.gpmercatus.in/" />
    <meta
      property="og:title"
      content="GP Mercatus – Global Digital Marketing Agency"
    />

    <meta
      property="og:description"
      content="Performance marketing, SEO, and social media strategies for global brands."
    />

    <meta
      property="og:image"
      content="https://www.gpmercatus.in/og-image.webp"
    />

    <meta property="og:site_name" content="GP Mercatus" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="GP Mercatus – Global Digital Marketing Agency"
    />

    <meta
      name="twitter:description"
      content="SEO, social media, and performance marketing solutions."
    />

    <meta
      name="twitter:image"
      content="https://www.gpmercatus.in/og-image.webp"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GP Mercatus",
        "url": "https://www.gpmercatus.in",
        "logo": "https://www.gpmercatus.in/logo.webp",
        "telephone": "+91-8800426115",
        "email": "support@gpmercatus.in",
        "description": "Global digital marketing agency specializing in SEO, performance marketing, and branding.",
        "sameAs": [
          "https://www.instagram.com/gpmercatus",
          "https://www.facebook.com/gpmercatus",
          "https://www.linkedin.com/company/gpmercatus"
        ]
      }
    </script>

    <!-- Delayed Google Analytics -->
    <script>
      window.addEventListener("load", () => {
        setTimeout(() => {
          const script = document.createElement("script");
          script.src =
            "https://www.googletagmanager.com/gtag/js?id=G-H1FBH1N7XC";
          script.async = true;
          document.head.appendChild(script);

          window.dataLayer = window.dataLayer || [];

          function gtag() {
            dataLayer.push(arguments);
          }

          window.gtag = gtag;

          gtag("js", new Date());
          gtag("config", "G-H1FBH1N7XC");
        }, 3000);
      });
    </script>
  </head>

  <body>
    <div id="root"></div>

    <!-- Main App -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
